name: Generate Bootable ISO (Manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to convert to ISO'
        required: true
        default: 'latest'

jobs:
  generate-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Convert repository name to strictly lowercase
      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Create output directory for ISO
      - name: Prepare Output Directory
        run: mkdir -p ./output

      # Log in to GHCR so Podman can pull the container image
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-pull the target image into podman container storage
      - name: Pre-pull Target Image
        run: |
          sudo podman pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      # Run bootc-image-builder with Btrfs root filesystem
      - name: Build ISO with Bootc Image Builder
        run: |
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build \
            --output /output \
            --type anaconda-iso \
            --rootfs btrfs \
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      # Upload the generated ISO file as a GitHub Artifact
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinoite-Library-ISO-${{ github.event.inputs.image_tag }}
          path: ./output
          if-no-files-found: error
