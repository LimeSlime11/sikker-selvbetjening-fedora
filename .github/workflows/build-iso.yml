name: Generate Bootable ISO (Manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to convert to ISO'
        required: true
        default: 'latest'

jobs:
  generate-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Convert repository name to strictly lowercase
      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Convert GHCR Container Image to Anaconda ISO using @main
      - name: Build ISO using Bootc Image Builder
        id: build-iso
        uses: osbuild/bootc-image-builder-action@main
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
          types: |
            anaconda-iso

      # Upload the generated ISO file as a GitHub Artifact
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinoite-Library-ISO-${{ github.event.inputs.image_tag }}
          path: ${{ steps.build-iso.outputs.output-directory }}
          if-no-files-found: error
